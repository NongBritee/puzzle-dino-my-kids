<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fd6ff">
<title>ไดโนจิ๊กซอว์</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<main id="app">
  <section id="menu" class="screen">
    <h1><span class="emoji">🦖</span> ไดโนจิ๊กซอว์ <span class="emoji">🧩</span></h1>
    <p id="count"></p>
    <div id="levels" role="group" aria-label="ระดับความยาก">
      <button class="lvl" data-n="2" aria-label="ง่าย 4 ชิ้น"><b>4</b> ชิ้น<br><small>ง่าย</small></button>
      <button class="lvl" data-n="3" aria-label="9 ชิ้น"><b>9</b> ชิ้น<br><small>สนุก</small></button>
    </div>
    <div id="grid"></div>
  </section>

  <section id="play" class="screen" hidden>
    <header>
      <button id="home" class="round" aria-label="กลับหน้าแรก">🏠</button>
      <div id="ref" aria-label="ภาพเฉลย"></div>
      <button id="hint" class="round" aria-label="ใบ้">💡</button>
    </header>
    <div id="stage"></div>
    <div id="win" hidden>
      <div id="winName"></div>
      <div id="winBtns">
        <button id="again" class="round big" aria-label="เล่นอีกครั้ง">🔁</button>
        <button id="next" class="round big go" aria-label="ตัวต่อไป">▶️</button>
        <button id="winHome" class="round big" aria-label="หน้าแรก">🏠</button>
      </div>
    </div>
    <canvas id="fx"></canvas>
  </section>
</main>
<script src="js/art.js?v=3"></script>
<script src="js/game.js?v=3"></script>
</body>
</html>
